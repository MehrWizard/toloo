[workspace]
members = [
    "app",
    "bench",
    "cli",
    "core",
    "lib",
    "wasm",
]
resolver = "2"

# Lean dev artifacts; for full symbols:
# CARGO_PROFILE_DEV_DEBUG=2 CARGO_PROFILE_DEV_STRIP=none
[profile.dev]
debug = 0
strip = "debuginfo"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
i-slint-backend-android-activity = { path = "app/vendor/i-slint-backend-android-activity-1.18.1" }
