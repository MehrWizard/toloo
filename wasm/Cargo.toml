[package]
name = "toloo-wasm"
version = "0.1.8"
edition = "2021"
description = "Toloo Protocol v0.2 — WebAssembly bindings for the portable core"

[lib]
crate-type = ["cdylib", "rlib"]
name = "toloo_wasm"
path = "src/lib.rs"

[dependencies]
toloo-core = { path = "../core", default-features = false, features = ["wasm"] }
wasm-bindgen = "=0.2.126"
anyhow = "1"
serde = "1"
serde_json = "1"

[dev-dependencies]
wasm-bindgen-test = "=0.3.76"
