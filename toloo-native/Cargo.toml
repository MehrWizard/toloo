[package]
name = "toloo-native"
version = "0.1.0"
edition = "2021"
description = "Toloo native client — Slint UI over the native Rust engine"
publish = false

[lib]
name = "toloo_native"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "toloo-native"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.18.0"

[dependencies]
toloo-lib = { path = "../toloo-lib", default-features = false, features = ["tls"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.18.0", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18.0", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-android-activity-06",
    "renderer-skia-opengl",
    "accessibility",
] }

[package.metadata.android]
package = "com.irandawn.toloo"
apk_name = "toloo-native"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Toloo"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
