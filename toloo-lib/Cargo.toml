[package]
name = "toloo-lib"
version = "0.1.7"
edition = "2021"
description = "Toloo Protocol v0.2 — stateful native runtime (pool, transport, requests)"

[lib]
name = "toloo_lib"
path = "src/lib.rs"

[dependencies]
# Cryptography still used directly by the native runtime (TLS key/cert
# generation, key-store nonces, RNG).
getrandom     = { version = "0.3", optional = true }
ed25519-dalek = { version = "3", optional = true, default-features = false, features = ["fast", "zeroize", "pkcs8", "signature", "alloc", "batch"] }
sha2          = { version = "0.10", optional = true }

# Optional: Argon2 for key derivation (password hashing) - enabled by "argon2" feature
argon2 = { version = "0.5", optional = true, default-features = false, features = ["alloc"] }

# Optional: X.509 certificate generation for TLS (enabled by "tls" feature)
x509-cert = { version = "0.3", optional = true, features = ["builder", "std", "pem"] }
der = { version = "0.8", optional = true }
const-oid = { version = "0.10", optional = true }

# Async runtime and networking
tokio             = { version = "1", default-features = false, features = ["rt", "macros", "net", "io-util", "time", "sync"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util      = "0.3"

# Optional: TLS support (enabled by "tls" feature)
tokio-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["aws-lc-rs", "std", "tls12"] }

# Encoding / serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow    = "1"
dashmap = "6.2.1"

# Portable protocol core (crypto, envelopes, canonical JSON, ids, events).
# simd-json 0.8 cannot build its scalar fallback on ARM Android, so Android
# uses the serde_json parser; desktop keeps SIMD parsing.
[target.'cfg(not(target_os = "android"))'.dependencies]
toloo-core = { path = "../toloo-core" }

[target.'cfg(target_os = "android")'.dependencies]
toloo-core = { path = "../toloo-core", default-features = false }

[features]
default = ["tls", "argon2"]
# TLS support for wss/https relay endpoints
tls = ["tokio-rustls", "rustls/std", "rustls/tls12", "rustls/aws-lc-rs", "x509-cert/std", "x509-cert/pem", "der", "const-oid", "tokio-tungstenite/rustls-tls-webpki-roots", "aws-lc", "dep:getrandom", "dep:ed25519-dalek", "dep:sha2"]
# Assembly-accelerated crypto in the core; dalek is the fallback
aws-lc = ["toloo-core/aws-lc"]
# Argon2 for key derivation (password hashing)
argon2 = ["dep:argon2", "dep:getrandom"]

[dev-dependencies]
toloo-core = { path = "../toloo-core", features = ["fixtures"] }
tokio      = { version = "1", features = ["full", "test-util"] }
serde_json = "1"
criterion  = "0.5"

[[bench]]
name = "canonical_bench"
harness = false
