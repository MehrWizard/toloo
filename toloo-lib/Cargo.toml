[package]
name = "toloo-lib"
version = "0.1.0"
edition = "2021"
description = "Toloo Protocol v0.2 — protocol core + stateful runtime (pool, transport, requests)"

[lib]
name = "toloo_lib"
path = "src/lib.rs"

[dependencies]
# Cryptography (audited crates)
ed25519-dalek    = { version = "2", features = ["rand_core", "zeroize"] }
x25519-dalek     = { version = "2", features = ["static_secrets", "zeroize"] }
chacha20poly1305 = "0.10"
argon2           = "0.5"
hkdf             = "0.12"
sha2             = "0.10"
rand_core        = { version = "0.6", features = ["getrandom"] }
zeroize          = { version = "1", features = ["derive"] }

# Async runtime and networking
tokio             = { version = "1", default-features = false, features = ["rt", "macros", "net", "io-util"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util      = "0.3"

# TLS (wss / https relay endpoints)
tokio-rustls = "0.26"
rustls        = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen         = "0.14"

# Encoding / serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow    = "1"

[dev-dependencies]
tokio      = { version = "1", features = ["full", "test-util"] }
serde_json = "1"
