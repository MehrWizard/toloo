name: App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: App tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-test
      - name: Install Slint build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libfontconfig1-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libgl1-mesa-dev
      - name: Test native engine and UI crate
        run: cargo test -p toloo-app

  desktop:
    name: Build app (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
            binary: target/release/toloo-app
          - os: windows-latest
            artifact: windows-x86_64
            binary: target/release/toloo-app.exe
          - os: macos-latest
            artifact: macos-aarch64
            binary: target/release/toloo-app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-desktop-${{ matrix.artifact }}
      - name: Install Slint build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libfontconfig1-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libgl1-mesa-dev
      - name: Build
        run: cargo build -p toloo-app --release
      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' toloo-app/Cargo.toml | head -1)
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Package
        shell: bash
        run: |
          ext=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then ext=".exe"; fi
          mkdir -p dist
          cp "${{ matrix.binary }}" \
            "dist/toloo-app-${{ steps.version.outputs.value }}-${{ matrix.artifact }}${ext}"
          chmod +x dist/* 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: toloo-app-${{ steps.version.outputs.value }}-${{ matrix.artifact }}
          path: dist/

  android:
    name: Build Android APK (experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: cargo-bins/cargo-binstall@v1.17.5
        env:
          BINSTALL_VERSION: "1.17.5"
      - name: Install cargo-ndk
        run: cargo binstall --no-confirm cargo-ndk@4.1.2 || cargo install cargo-ndk --version 4.1.2 --locked
      - name: Decode release signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/android"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d \
            > "$RUNNER_TEMP/android/toloo-release.jks"
      - name: Build Android native libraries
        run: ./toloo-app/android/build-native.sh
      - name: Build signed APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android/toloo-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: toloo
        run: gradle -p toloo-app/android --no-daemon assembleRelease
      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' toloo-app/Cargo.toml | head -1)
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Package APKs
        run: |
          mkdir -p dist/android
          apkdir=toloo-app/android/app/build/outputs/apk/release
          cp "$apkdir/app-arm64-v8a-release.apk" \
            "dist/android/toloo-app-${{ steps.version.outputs.value }}-android-arm64-v8a.apk"
          cp "$apkdir/app-armeabi-v7a-release.apk" \
            "dist/android/toloo-app-${{ steps.version.outputs.value }}-android-armeabi-v7a.apk"
          cp "$apkdir/app-universal-release.apk" \
            "dist/android/toloo-app-${{ steps.version.outputs.value }}-android-universal.apk"
          ls -lh dist/android
      - uses: actions/upload-artifact@v4
        with:
          name: toloo-app-${{ steps.version.outputs.value }}-android
          path: dist/android/*.apk
          if-no-files-found: error
