name: Benchmark

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Benchmark repo (owner/repo)'
        required: true
        default: 'MehrWizard/toloo-benchmarks'
      branch:
        description: 'Branch to benchmark'
        required: false
        default: 'main'
      runs:
        description: 'Number of benchmark iterations'
        required: false
        default: '10'

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Prepare benchmark repo (clone or create)
  # ────────────────────────────────────────────────────────────────────
  prepare-repo:
    name: Prepare Benchmark Repo
    runs-on: ubuntu-latest
    outputs:
      repo-existed: ${{ steps.check-repo.outputs.existed }}
    steps:
      - name: Check if benchmark repo exists
        id: check-repo
        run: |
          if gh repo view "${{ github.event.inputs.repo }}" >/dev/null 2>&1; then
            echo "existed=true" >> $GITHUB_OUTPUT
          else
            echo "existed=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────────────────────────────────────────────────────
  # Run benchmarks on Linux (x86_64 + aarch64)
  # ────────────────────────────────────────────────────────────────────
  bench-linux-x86:
    name: Benchmark Linux x86_64
    needs: prepare-repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-gnu

      - name: Install criterion deps
        run: sudo apt-get update && sudo apt-get install -y gnuplot

      - name: Run benchmarks
        working-directory: toloo-lib
        run: |
          set -o pipefail
          cargo bench --bench canonical_bench 2>&1 | tee ../bench-results.txt

      - name: Debug benchmark output
        if: always()
        working-directory: toloo-lib
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Workspace target/criterion structure ==="
          find ../target/criterion -name "*.json" 2>/dev/null | head -20 || echo "No JSON files found"
          echo "=== Workspace target/criterion tree ==="
          ls -la ../target/criterion/ 2>/dev/null || echo "No criterion dir"
          ls -la ../target/criterion/*/ 2>/dev/null || echo "No group dirs"
          ls -la ../target/criterion/*/*/ 2>/dev/null || echo "No bench dirs"

      - name: Extract benchmark JSON
        working-directory: toloo-lib
        run: |
          mkdir -p bench-json
          for f in ../target/criterion/*/*/new/estimates.json; do
            rel="${f#../target/criterion/}"
            group="${rel%%/*}"
            bench="${rel#*/}"
            bench="${bench%/new/estimates.json}"
            cp "$f" "bench-json/${group}_${bench}.json"
          done

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-linux-x86
          path: |
            toloo-lib/bench-results.txt
            toloo-lib/bench-json/

  bench-linux-arm:
    name: Benchmark Linux aarch64
    needs: prepare-repo
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-linux-arm-${{ github.sha }}

      - name: Install criterion deps
        run: sudo apt-get update && sudo apt-get install -y gnuplot

      - name: Run benchmarks
        working-directory: toloo-lib
        run: |
          set -o pipefail
          cargo bench --bench canonical_bench 2>&1 | tee ../bench-results.txt

      - name: Debug benchmark output
        if: always()
        working-directory: toloo-lib
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Workspace target/criterion structure ==="
          find ../target/criterion -name "*.json" 2>/dev/null | head -20 || echo "No JSON files found"
          echo "=== Workspace target/criterion tree ==="
          ls -la ../target/criterion/ 2>/dev/null || echo "No criterion dir"
          ls -la ../target/criterion/*/ 2>/dev/null || echo "No group dirs"
          ls -la ../target/criterion/*/*/ 2>/dev/null || echo "No bench dirs"

      - name: Extract benchmark JSON
        working-directory: toloo-lib
        run: |
          mkdir -p bench-json
          for f in ../target/criterion/*/*/new/estimates.json; do
            rel="${f#../target/criterion/}"
            group="${rel%%/*}"
            bench="${rel#*/}"
            bench="${bench%/new/estimates.json}"
            cp "$f" "bench-json/${group}_${bench}.json"
          done

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-linux-arm
          path: |
            toloo-lib/bench-results.txt
            toloo-lib/bench-json/

  # ────────────────────────────────────────────────────────────────────
  # Run benchmarks on Windows
  # ────────────────────────────────────────────────────────────────────
  bench-windows:
    name: Benchmark Windows x86_64
    needs: prepare-repo
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Run benchmarks
        working-directory: toloo-lib
        shell: pwsh
        run: |
          cargo bench --bench canonical_bench 2>&1 | Tee-Object -FilePath ../bench-results.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Debug benchmark output
        if: always()
        working-directory: toloo-lib
        shell: pwsh
        run: |
          Write-Host "=== Current directory ==="
          Get-Location
          Write-Host "=== Workspace target/criterion structure ==="
          Get-ChildItem ../target/criterion -Recurse -Filter "*.json" -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object { $_.FullName }
          if (-not (Test-Path "../target/criterion")) { Write-Host "No criterion dir" }
          Get-ChildItem ../target/criterion -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          Get-ChildItem ../target/criterion/* -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          Get-ChildItem ../target/criterion/*/* -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }

      - name: Extract benchmark JSON
        working-directory: toloo-lib
        shell: pwsh
        run: |
          mkdir bench-json
          Get-ChildItem ../target/criterion/*/*/new/estimates.json | ForEach-Object {
            $rel = $_.FullName.Replace((Resolve-Path ../target/criterion).Path + '\', '')
            $parts = $rel.Split('\')
            $group = $parts[0]
            $bench = $parts[1..($parts.Length - 2)] -join '_'
            Copy-Item $_ "bench-json/${group}_${bench}.json"
          }

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-windows
          path: |
            toloo-lib/bench-results.txt
            toloo-lib/bench-json/

  # ────────────────────────────────────────────────────────────────────
  # Run benchmarks on macOS
  # ────────────────────────────────────────────────────────────────────
  bench-macos-x86:
    name: Benchmark macOS x86_64
    needs: prepare-repo
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-apple-darwin

      - name: Run benchmarks
        working-directory: toloo-lib
        run: |
          set -o pipefail
          cargo bench --bench canonical_bench 2>&1 | tee ../bench-results.txt

      - name: Debug benchmark output
        if: always()
        working-directory: toloo-lib
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Workspace target/criterion structure ==="
          find ../target/criterion -name "*.json" 2>/dev/null | head -20 || echo "No JSON files found"
          echo "=== Workspace target/criterion tree ==="
          ls -la ../target/criterion/ 2>/dev/null || echo "No criterion dir"
          ls -la ../target/criterion/*/ 2>/dev/null || echo "No group dirs"
          ls -la ../target/criterion/*/*/ 2>/dev/null || echo "No bench dirs"

      - name: Extract benchmark JSON
        working-directory: toloo-lib
        run: |
          mkdir -p bench-json
          for f in ../target/criterion/*/*/new/estimates.json; do
            rel="${f#../target/criterion/}"
            group="${rel%%/*}"
            bench="${rel#*/}"
            bench="${bench%/new/estimates.json}"
            cp "$f" "bench-json/${group}_${bench}.json"
          done

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-macos-x86
          path: |
            toloo-lib/bench-results.txt
            toloo-lib/bench-json/

  bench-macos-arm:
    name: Benchmark macOS aarch64
    needs: prepare-repo
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-macos-arm-${{ github.sha }}

      - name: Run benchmarks
        working-directory: toloo-lib
        run: |
          set -o pipefail
          cargo bench --bench canonical_bench 2>&1 | tee ../bench-results.txt

      - name: Debug benchmark output
        if: always()
        working-directory: toloo-lib
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Workspace target/criterion structure ==="
          find ../target/criterion -name "*.json" 2>/dev/null | head -20 || echo "No JSON files found"
          echo "=== Workspace target/criterion tree ==="
          ls -la ../target/criterion/ 2>/dev/null || echo "No criterion dir"
          ls -la ../target/criterion/*/ 2>/dev/null || echo "No group dirs"
          ls -la ../target/criterion/*/*/ 2>/dev/null || echo "No bench dirs"

      - name: Extract benchmark JSON
        working-directory: toloo-lib
        run: |
          mkdir -p bench-json
          for f in ../target/criterion/*/*/new/estimates.json; do
            rel="${f#../target/criterion/}"
            group="${rel%%/*}"
            bench="${rel#*/}"
            bench="${bench%/new/estimates.json}"
            cp "$f" "bench-json/${group}_${bench}.json"
          done

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-macos-arm
          path: |
            toloo-lib/bench-results.txt
            toloo-lib/bench-json/

  # ────────────────────────────────────────────────────────────────────
  # Aggregate & Store Results + Deploy to GitHub Pages
  # ────────────────────────────────────────────────────────────────────
  aggregate:
    name: Aggregate & Store Results
    needs: [prepare-repo, bench-linux-x86, bench-linux-arm, bench-windows, bench-macos-x86, bench-macos-arm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Install Python for aggregation
        run: sudo apt-get update && sudo apt-get install -y python3 python3-pip

      - name: Aggregate benchmark results
        run: |
          cat << 'PYEOF' > aggregate.py
          import json
          import sys
          from pathlib import Path
          from datetime import datetime

          results = {
              "timestamp": datetime.utcnow().isoformat() + "Z",
              "commit": "${{ github.sha }}",
              "branch": "${{ github.event.inputs.branch }}",
              "platforms": {}
          }

          for platform_dir in Path("artifacts").iterdir():
              if not platform_dir.is_dir():
                  continue
              platform = platform_dir.name.replace("bench-", "")
              results["platforms"][platform] = {}

              for json_file in (platform_dir / "bench-json").glob("*.json"):
                  # Format: group_bench.json
                  parts = json_file.stem.split('_', 1)
                  if len(parts) == 2:
                      group, bench_name = parts
                      bench_name = f"{group}/{bench_name}"
                  else:
                      bench_name = json_file.stem
                  try:
                      with open(json_file) as f:
                          data = json.load(f)
                      mean_ns = data["mean"]["point_estimate"]
                      results["platforms"][platform][bench_name] = {
                          "mean_ns": mean_ns,
                          "median_ns": data["median"]["point_estimate"],
                          "std_dev_ns": data["std_dev"]["point_estimate"],
                      }
                  except Exception as e:
                      print(f"Failed to parse {json_file}: {e}", file=sys.stderr)

          output = Path("benchmark-report.json")
          output.write_text(json.dumps(results, indent=2))
          print(f"Written {output}")
          PYEOF
          python3 aggregate.py

      - name: Commit results to benchmark repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo }}
          token: ${{ secrets.BENCHMARK_REPO_PAT }}
          path: bench-repo
          fetch-depth: 0

      - name: Copy results to benchmark repo
        run: |
          cd bench-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ../benchmark-report.json results/${{ github.sha }}.json
          cp ../benchmark-report.json results/latest.json
          git add results/${{ github.sha }}.json results/latest.json
          git commit -m "Benchmark: ${{ github.sha }} (${{ github.event.inputs.branch }})"
          git push
        env:
          GH_TOKEN: ${{ secrets.BENCHMARK_REPO_PAT }}

      - name: Deploy to GitHub Pages
        if: github.repository == 'MehrWizard/toloo-benchmarks'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          destination_dir: .
          keep_files: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload aggregated report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark-report.json

  # ────────────────────────────────────────────────────────────────────
  # Compare with baseline (previous commit on main)
  # ────────────────────────────────────────────────────────────────────
  compare:
    name: Compare with Baseline
    needs: [aggregate]
    if: github.event.inputs.branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-report
          path: artifacts/

      - name: Fetch baseline from benchmark repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo }}
          token: ${{ secrets.BENCHMARK_REPO_PAT }}
          path: bench-repo
          fetch-depth: 0

      - name: Find baseline commit
        run: |
          cd bench-repo
          BASELINE=$(git log --oneline --all -- results/ | head -2 | tail -1 | cut -d' ' -f1)
          if [ -n "$BASELINE" ]; then
            cp results/${BASELINE}.json ../baseline.json
            echo "baseline=${BASELINE}" >> $GITHUB_OUTPUT
          else
            echo "baseline=" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.BENCHMARK_REPO_PAT }}

      - name: Compare benchmarks
        if: steps.fetch.outputs.baseline != ''
        run: |
          cat << 'PYEOF' > compare.py
          import json
          import sys

          with open("artifacts/benchmark-report.json") as f:
              current = json.load(f)
          with open("baseline.json") as f:
              baseline = json.load(f)

          print(f"=== Benchmark Comparison ===")
          print(f"Current: {current['commit'][:8]} ({current['branch']})")
          print(f"Baseline: {baseline['commit'][:8]} ({baseline['branch']})")
          print()

          regressions = []
          improvements = []

          for platform in current["platforms"]:
              if platform not in baseline["platforms"]:
                  continue
              print(f"--- {platform} ---")
              for bench in current["platforms"][platform]:
                  if bench not in baseline["platforms"][platform]:
                      continue
                  cur = current["platforms"][platform][bench]["mean_ns"]
                  base = baseline["platforms"][platform][bench]["mean_ns"]
                  if base == 0:
                      continue
                  pct = ((cur - base) / base) * 100
                  status = "⚠️ REGRESSION" if pct > 5 else ("✅ IMPROVED" if pct < -5 else "→ stable")
                  print(f"  {bench}: {base:.0f}ns → {cur:.0f}ns ({pct:+.1f}%) {status}")
                  if pct > 5:
                      regressions.append((platform, bench, pct))
                  elif pct < -5:
                      improvements.append((platform, bench, pct))

          print()
          if regressions:
              print("⚠️ REGRESSIONS:")
              for p, b, pct in regressions:
                  print(f"  {p}/{b}: +{pct:.1f}%")
              sys.exit(1)
          else:
              print("✅ No significant regressions")

          if improvements:
              print("✅ IMPROVEMENTS:")
              for p, b, pct in improvements:
                  print(f"  {p}/{b}: {pct:.1f}%")
          PYEOF
          python3 compare.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}