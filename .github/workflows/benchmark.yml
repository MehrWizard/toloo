name: Benchmark

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Benchmark repo (owner/repo)'
        required: true
        default: 'MehrWizard/toloo-benchmarks'
      branch:
        description: 'Branch to benchmark'
        required: false
        default: 'main'
      runs:
        description: 'Number of benchmark iterations'
        required: false
        default: '10'

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Prepare benchmark repo (clone or create)
  # ────────────────────────────────────────────────────────────────────
  prepare-repo:
    name: Prepare Benchmark Repo
    runs-on: ubuntu-latest
    outputs:
      repo-existed: ${{ steps.check-repo.outputs.existed }}
    steps:
      - name: Check if benchmark repo exists
        id: check-repo
        run: |
          if gh repo view "${{ github.event.inputs.repo }}" >/dev/null 2>&1; then
            echo "existed=true" >> $GITHUB_OUTPUT
          else
            echo "existed=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────────────────────────────────────────────────────
  # Run benchmarks on Linux (x86_64 + aarch64)
  # ────────────────────────────────────────────────────────────────────
  bench-linux-x86:
    name: Benchmark Linux x86_64 (1 vCPU - ubuntu-slim)
    needs: prepare-repo
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-gnu

      - name: Install criterion deps
        run: sudo apt-get update && sudo apt-get install -y gnuplot

      - name: Run benchmarks
        working-directory: toloo-lib
        run: |
          set -o pipefail
          cargo bench --bench canonical_bench 2>&1 | tee ../bench-results.txt

      - name: Debug benchmark output
        if: always()
        working-directory: toloo-lib
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Workspace target/criterion structure ==="
          find ../target/criterion -name "*.json" 2>/dev/null | head -20 || echo "No JSON files found"
          echo "=== Workspace target/criterion tree ==="
          ls -la ../target/criterion/ 2>/dev/null || echo "No criterion dir"
          ls -la ../target/criterion/*/ 2>/dev/null || echo "No group dirs"
          ls -la ../target/criterion/*/*/ 2>/dev/null || echo "No bench dirs"

      - name: Extract benchmark JSON
        working-directory: toloo-lib
        run: |
          mkdir -p bench-json
          # Handle all criterion output depths: 1-level (bench_function), 2-level (group/bench), 3-level (group/subgroup/bench)
          while IFS= read -r -d '' f; do
            rel="${f#../target/criterion/}"
            # Remove /new/estimates.json suffix
            rel="${rel%/new/estimates.json}"
            # Replace all / with __ for safe filename
            rel_safe="${rel//\//__}"
            cp "$f" "bench-json/${rel_safe}.json"
          done < <(find ../target/criterion -name "estimates.json" -path "*/new/*" -print0)

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-linux-x86
          path: |
            toloo-lib/bench-results.txt
            toloo-lib/bench-json/

  # ────────────────────────────────────────────────────────────────────
  # Cross-protocol comparison (Signal, Matrix, Nostr) — Linux x86 only.
  # Heavy/AGPL libraries stay in toloo-protocol-bench behind a feature.
  # ────────────────────────────────────────────────────────────────────
  bench-protocols:
    name: Benchmark Cross-Protocol (Linux x86_64)
    needs: prepare-repo
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-protocols-${{ github.sha }}

      - name: Run cross-protocol benchmarks
        run: |
          set -o pipefail
          cargo bench -p toloo-protocol-bench --features protocols --bench protocols -- \
            --warm-up-time 0.5 --measurement-time 2 2>&1 | tee bench-protocols-results.txt

      - name: Extract benchmark JSON
        run: |
          mkdir -p bench-json
          while IFS= read -r -d '' f; do
            rel="${f#target/criterion/}"
            rel="${rel%/new/estimates.json}"
            rel_safe="${rel//\//__}"
            cp "$f" "bench-json/${rel_safe}.json"
          done < <(find target/criterion -name "estimates.json" -path "*/new/*" -print0)

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-protocols
          path: |
            bench-protocols-results.txt
            bench-json/

  bench-linux-arm:
    name: Benchmark Linux aarch64
    needs: prepare-repo
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-linux-arm-${{ github.sha }}

      - name: Install criterion deps
        run: sudo apt-get update && sudo apt-get install -y gnuplot

      - name: Run benchmarks
        working-directory: toloo-lib
        run: |
          set -o pipefail
          cargo bench --bench canonical_bench 2>&1 | tee ../bench-results.txt

      - name: Debug benchmark output
        if: always()
        working-directory: toloo-lib
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Workspace target/criterion structure ==="
          find ../target/criterion -name "*.json" 2>/dev/null | head -20 || echo "No JSON files found"
          echo "=== Workspace target/criterion tree ==="
          ls -la ../target/criterion/ 2>/dev/null || echo "No criterion dir"
          ls -la ../target/criterion/*/ 2>/dev/null || echo "No group dirs"
          ls -la ../target/criterion/*/*/ 2>/dev/null || echo "No bench dirs"

      - name: Extract benchmark JSON
        working-directory: toloo-lib
        run: |
          mkdir -p bench-json
          # Handle all criterion output depths: 1-level (bench_function), 2-level (group/bench), 3-level (group/subgroup/bench)
          while IFS= read -r -d '' f; do
            rel="${f#../target/criterion/}"
            # Remove /new/estimates.json suffix
            rel="${rel%/new/estimates.json}"
            # Replace all / with __ for safe filename
            rel_safe="${rel//\//__}"
            cp "$f" "bench-json/${rel_safe}.json"
          done < <(find ../target/criterion -name "estimates.json" -path "*/new/*" -print0)

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-linux-arm
          path: |
            toloo-lib/bench-results.txt
            toloo-lib/bench-json/



  # ────────────────────────────────────────────────────────────────────
  # Run benchmarks on Windows
  # ────────────────────────────────────────────────────────────────────
  bench-windows:
    name: Benchmark Windows x86_64
    needs: prepare-repo
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Run benchmarks
        working-directory: toloo-lib
        shell: pwsh
        run: |
          cargo bench --bench canonical_bench 2>&1 | Tee-Object -FilePath ../bench-results.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Debug benchmark output
        if: always()
        working-directory: toloo-lib
        shell: pwsh
        run: |
          Write-Host "=== Current directory ==="
          Get-Location
          Write-Host "=== Workspace target/criterion structure ==="
          Get-ChildItem ../target/criterion -Recurse -Filter "*.json" -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object { $_.FullName }
          if (-not (Test-Path "../target/criterion")) { Write-Host "No criterion dir" }
          Get-ChildItem ../target/criterion -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          Get-ChildItem ../target/criterion/* -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          Get-ChildItem ../target/criterion/*/* -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }

      - name: Extract benchmark JSON
        working-directory: toloo-lib
        shell: pwsh
        run: |
          mkdir bench-json
          Get-ChildItem ../target/criterion -Recurse -Filter "estimates.json" | Where-Object { $_.FullName -match '\\new\\estimates\.json$' } | ForEach-Object {
            $rel = $_.FullName.Replace((Resolve-Path ../target/criterion).Path + '\', '')
            $rel = $rel -replace '\\new\\estimates\.json$', ''
            $rel_safe = $rel -replace '\\', '__'
            Copy-Item $_ "bench-json/${rel_safe}.json"
          }

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-windows
          path: |
            toloo-lib/bench-results.txt
            toloo-lib/bench-json/

  # ────────────────────────────────────────────────────────────────────
  # Run benchmarks on macOS
  # ────────────────────────────────────────────────────────────────────
  bench-macos-x86:
    name: Benchmark macOS x86_64
    needs: prepare-repo
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-apple-darwin

      - name: Run benchmarks
        working-directory: toloo-lib
        run: |
          set -o pipefail
          cargo bench --bench canonical_bench 2>&1 | tee ../bench-results.txt

      - name: Debug benchmark output
        if: always()
        working-directory: toloo-lib
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Workspace target/criterion structure ==="
          find ../target/criterion -name "*.json" 2>/dev/null | head -20 || echo "No JSON files found"
          echo "=== Workspace target/criterion tree ==="
          ls -la ../target/criterion/ 2>/dev/null || echo "No criterion dir"
          ls -la ../target/criterion/*/ 2>/dev/null || echo "No group dirs"
          ls -la ../target/criterion/*/*/ 2>/dev/null || echo "No bench dirs"

      - name: Extract benchmark JSON
        working-directory: toloo-lib
        run: |
          mkdir -p bench-json
          # Handle all criterion output depths: 1-level (bench_function), 2-level (group/bench), 3-level (group/subgroup/bench)
          while IFS= read -r -d '' f; do
            rel="${f#../target/criterion/}"
            # Remove /new/estimates.json suffix
            rel="${rel%/new/estimates.json}"
            # Replace all / with __ for safe filename
            rel_safe="${rel//\//__}"
            cp "$f" "bench-json/${rel_safe}.json"
          done < <(find ../target/criterion -name "estimates.json" -path "*/new/*" -print0)

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-macos-x86
          path: |
            toloo-lib/bench-results.txt
            toloo-lib/bench-json/

  bench-macos-arm:
    name: Benchmark macOS aarch64
    needs: prepare-repo
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-macos-arm-${{ github.sha }}

      - name: Run benchmarks
        working-directory: toloo-lib
        run: |
          set -o pipefail
          cargo bench --bench canonical_bench 2>&1 | tee ../bench-results.txt

      - name: Debug benchmark output
        if: always()
        working-directory: toloo-lib
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Workspace target/criterion structure ==="
          find ../target/criterion -name "*.json" 2>/dev/null | head -20 || echo "No JSON files found"
          echo "=== Workspace target/criterion tree ==="
          ls -la ../target/criterion/ 2>/dev/null || echo "No criterion dir"
          ls -la ../target/criterion/*/ 2>/dev/null || echo "No group dirs"
          ls -la ../target/criterion/*/*/ 2>/dev/null || echo "No bench dirs"

      - name: Extract benchmark JSON
        working-directory: toloo-lib
        run: |
          mkdir -p bench-json
          # Handle all criterion output depths: 1-level (bench_function), 2-level (group/bench), 3-level (group/subgroup/bench)
          while IFS= read -r -d '' f; do
            rel="${f#../target/criterion/}"
            # Remove /new/estimates.json suffix
            rel="${rel%/new/estimates.json}"
            # Replace all / with __ for safe filename
            rel_safe="${rel//\//__}"
            cp "$f" "bench-json/${rel_safe}.json"
          done < <(find ../target/criterion -name "estimates.json" -path "*/new/*" -print0)

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-macos-arm
          path: |
            toloo-lib/bench-results.txt
            toloo-lib/bench-json/

  # ────────────────────────────────────────────────────────────────────
  # Aggregate & Store Results + Deploy to GitHub Pages
  # ────────────────────────────────────────────────────────────────────
  aggregate:
    name: Aggregate & Store Results
    needs: [prepare-repo, bench-linux-x86, bench-protocols, bench-linux-arm, bench-windows, bench-macos-x86, bench-macos-arm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all available artifacts
        if: always()
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Report platform status
        if: always()
        run: |
          echo "=== Available platform artifacts ==="
          for d in artifacts/*/ ; do
            if [ -d "$d" ] && [ -d "$d/bench-json" ]; then
              plat=$(basename "$d")
              count=$(ls "$d/bench-json/"*.json 2>/dev/null | wc -l)
              echo "  ✓ $plat: $count benchmarks"
            fi
          done
          echo "=== Done ==="

      - name: Install Python for aggregation
        run: sudo apt-get update && sudo apt-get install -y python3 python3-pip

      - name: Aggregate benchmark results
        run: |
          cat << 'PYEOF' > aggregate.py
          import json
          import sys
          from pathlib import Path
          from datetime import datetime, timezone

          results = {
              "timestamp": datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              "commit": "${{ github.sha }}",
              "branch": "${{ github.event.inputs.branch }}",
              "platforms": {}
          }

          for platform_dir in Path("artifacts").iterdir():
              if not platform_dir.is_dir():
                  continue
              platform = platform_dir.name.replace("bench-", "")
              results["platforms"][platform] = {}

              for json_file in (platform_dir / "bench-json").glob("*.json"):
                  # Format: full_path_with_slashes_replaced_by__.json
                  # e.g., canonical__encode__small.json -> canonical/encode/small
                  #       parse_envelope.json -> parse_envelope
                  bench_name = json_file.stem.replace('__', '/')
                  try:
                      with open(json_file) as f:
                          data = json.load(f)
                      mean_ns = data["mean"]["point_estimate"]
                      results["platforms"][platform][bench_name] = {
                          "mean_ns": mean_ns,
                          "median_ns": data["median"]["point_estimate"],
                          "std_dev_ns": data["std_dev"]["point_estimate"],
                      }
                  except Exception as e:
                      print(f"Failed to parse {json_file}: {e}", file=sys.stderr)

          output = Path("benchmark-report.json")
          output.write_text(json.dumps(results, indent=2))

          print(f"\n=== Platforms included ===")
          for plat in sorted(results["platforms"]):
              count = len(results["platforms"][plat])
              print(f"  ✓ {plat}: {count} benchmarks")

          expected = ['linux-x86', 'linux-arm', 'windows', 'macos-x86', 'macos-arm']
          missing = [p for p in expected if p not in results["platforms"]]
          if missing:
              print(f"\n=== Missing platforms (job failed or runner unavailable) ===")
              for p in missing:
                  print(f"  ✗ {p}")
          else:
              print(f"\n=== All 5 relay platforms present ===")

          if 'protocols' in results["platforms"]:
              print(f"  ✓ protocols (cross-protocol): {len(results['platforms']['protocols'])} benchmarks")
          else:
              print("  ✗ protocols (cross-protocol) missing — site falls back to estimates")

          print(f"\nWritten {output}")
          PYEOF
          python3 aggregate.py

      - name: Commit results to benchmark repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo }}
          token: ${{ secrets.BENCHMARK_REPO_PAT }}
          path: bench-repo
          fetch-depth: 0

      - name: Generate static HTML in benchmark repo
        run: |
          python3 substitute_template.py index.html.template benchmark-report.json bench-repo/index.html

      - name: Copy results to benchmark repo
        run: |
          cd bench-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ../benchmark-report.json results/${{ github.sha }}.json
          cp ../benchmark-report.json results/latest.json
          cp ../benchmark-og.png og.png
          git add results/${{ github.sha }}.json results/latest.json index.html og.png
          git commit -m "Benchmark: ${{ github.sha }} (${{ github.event.inputs.branch }})"
          git push
        env:
          GH_TOKEN: ${{ secrets.BENCHMARK_REPO_PAT }}

      
      - name: Upload aggregated report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark-report.json

  # ────────────────────────────────────────────────────────────────────
  # Compare with baseline (previous commit on main)
  # ────────────────────────────────────────────────────────────────────
  compare:
    name: Compare with Baseline
    needs: [aggregate]
    if: github.event.inputs.branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-report
          path: artifacts/

      - name: Fetch baseline from benchmark repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo }}
          token: ${{ secrets.BENCHMARK_REPO_PAT }}
          path: bench-repo
          fetch-depth: 0

      - name: Find baseline commit
        id: find-baseline
        run: |
          cd bench-repo
          # Find previous toloo commit SHA from result filenames (not benchmark repo git history)
          BASELINE=$(ls results/*.json 2>/dev/null | grep -v 'latest.json' | grep -v 'history.json' | sed 's|results/||' | sed 's|\.json$||' | sort -r | head -2 | tail -1)
          if [ -n "$BASELINE" ]; then
            cp results/${BASELINE}.json ../baseline.json
            echo "baseline=${BASELINE}" >> $GITHUB_OUTPUT
          else
            echo "baseline=" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.BENCHMARK_REPO_PAT }}

      - name: Compare benchmarks
        if: steps.find-baseline.outputs.baseline != ''
        run: |
          cat << 'PYEOF' > compare.py
          import json
          import sys

          with open("artifacts/benchmark-report.json") as f:
              current = json.load(f)
          with open("baseline.json") as f:
              baseline = json.load(f)

          print(f"=== Benchmark Comparison ===")
          print(f"Current: {current['commit'][:8]} ({current['branch']})")
          print(f"Baseline: {baseline['commit'][:8]} ({baseline['branch']})")
          print()

          regressions = []
          improvements = []

          for platform in current["platforms"]:
              if platform not in baseline["platforms"]:
                  continue
              print(f"--- {platform} ---")
              for bench in current["platforms"][platform]:
                  if bench not in baseline["platforms"][platform]:
                      continue
                  cur = current["platforms"][platform][bench]["mean_ns"]
                  base = baseline["platforms"][platform][bench]["mean_ns"]
                  if base == 0:
                      continue
                  pct = ((cur - base) / base) * 100
                  # GitHub runners have high variance; report but don't block
                  is_linux_x86 = platform == "linux-x86"
                  threshold = 10 if is_linux_x86 else 20
                  status = "⚠️ REGRESSION" if pct > threshold else ("✅ IMPROVED" if pct < -threshold else "→ stable")
                  print(f"  {bench}: {base:.0f}ns → {cur:.0f}ns ({pct:+.1f}%) {status}")
                  if pct > threshold:
                      regressions.append((platform, bench, pct))
                  elif pct < -threshold:
                      improvements.append((platform, bench, pct))

          print()
          if regressions:
              print("⚠️ REGRESSIONS (reported, not blocking):")
              for p, b, pct in regressions:
                  print(f"  {p}/{b}: +{pct:.1f}%")
          else:
              print("✅ No significant regressions")

          if improvements:
              print("✅ IMPROVEMENTS:")
              for p, b, pct in improvements:
                  print(f"  {p}/{b}: {pct:.1f}%")
          PYEOF
          python3 compare.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}