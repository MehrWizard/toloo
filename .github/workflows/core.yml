name: Core

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native
      - name: Test core and runtime
        run: cargo test -p toloo-core -p toloo-lib -p toloo-wasm
      # Toloo app and Android builds run in native.yml. This job covers the
      # portable core, runtime, CLI, and wasm crates.
      - name: Check all targets
        run: cargo check -p toloo-core -p toloo-lib -p toloo-cli -p toloo-wasm --all-targets

  wasm:
    name: Wasm tests and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check shared design contract
        run: node assets/generate.mjs --check
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      # Must match the pinned wasm-bindgen crate version.
      - uses: cargo-bins/cargo-binstall@v1.17.5
        env:
          BINSTALL_VERSION: "1.17.5"
      - name: Install wasm-bindgen-cli
        run: cargo binstall --no-confirm wasm-bindgen-cli --version 0.2.126
      - name: Run wasm tests
        run: cargo test -p toloo-wasm --target wasm32-unknown-unknown
      - name: Build browser package
        run: ./wasm/build.sh
      - name: Smoke-test generated package
        run: node wasm/test-package.mjs
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Test web client
        working-directory: web
        run: npm test
      - name: Build web client
        working-directory: web
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: toloo-wasm-pkg
          path: wasm/pkg/
      - uses: actions/upload-artifact@v4
        with:
          name: toloo-web-dist
          path: web/dist/
