name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:

  # ────────────────────────────────────────────────────────────────────
  # Native Slint builds — no WebView, direct Rust core.
  # ────────────────────────────────────────────────────────────────────
  build-native:
    name: Native (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
            binary: target/release/toloo-native
          - os: ubuntu-24.04-arm
            artifact: linux-aarch64
            binary: target/release/toloo-native
          - os: windows-latest
            artifact: windows-x86_64
            binary: target/release/toloo-native.exe
          - os: macos-latest
            artifact: macos-aarch64
            binary: target/release/toloo-native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.artifact }}
      - name: Install Slint build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libfontconfig1-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libgl1-mesa-dev
      - name: Build
        run: cargo build -p toloo-native --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  build-android:
    name: Android APK (experimental)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-android
      - uses: cargo-bins/cargo-binstall@v1.17.5
        env:
          BINSTALL_VERSION: "1.17.5"
      - name: Install cargo-apk
        run: cargo binstall --no-confirm cargo-apk || cargo install cargo-apk --locked
      - name: Decode release signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/android"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d \
            > "$RUNNER_TEMP/android/toloo-release.jks"
      - name: Build APK (arm64 + armv7)
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/android/toloo-release.jks
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: cargo apk build -p toloo-native --release --lib
      - name: Package universal APK
        run: |
          mkdir -p dist/android
          mapfile -t apks < <(find target -name '*.apk' -type f ! -name '*-unaligned.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "expected one universal APK, found ${#apks[@]}" >&2
            exit 1
          fi
          cp "${apks[0]}" dist/android/toloo-native.apk
          ls -lh dist/android
      - uses: actions/upload-artifact@v4
        with:
          name: toloo-native-android
          path: dist/android/*.apk
          if-no-files-found: error

  build-cli:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — fully static musl binary, runs on any Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: cli-linux-x86_64
            binary: toloo
            musl: true

          # Linux aarch64 — fully static musl binary, cross-compiled
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: cli-linux-aarch64
            binary: toloo
            musl: true
            musl_cross: true

          # Windows x86_64 — static CRT, no MSVC redistributable needed
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: cli-windows-x86_64
            binary: toloo.exe
            musl: false

          # Windows aarch64 — Surface / Snapdragon, static CRT
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: cli-windows-aarch64
            binary: toloo.exe
            musl: false

          # macOS x86_64 — no Xcode needed for a pure Rust CLI
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: cli-macos-x86_64
            binary: toloo
            musl: false

          # macOS aarch64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: cli-macos-aarch64
            binary: toloo
            musl: false

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}

      - name: Install musl tools
        if: matrix.musl == true
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache pip packages (Zig cross toolchain)
        if: matrix.musl_cross == true
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ziglang-${{ runner.os }}-${{ runner.arch }}-zig0.15-zigbuild0.19

      - name: Install cargo-zigbuild (aarch64 musl cross)
        if: matrix.musl_cross == true
        run: pip3 install ziglang cargo-zigbuild

      - name: Build
        run: ${{ matrix.musl_cross == true && 'cargo zigbuild' || 'cargo build' }} -p toloo-cli --release --target ${{ matrix.target }}
        env:
          # Statically link the CRT on Windows — .exe runs on any Win10+ with no redistributables
          RUSTFLAGS: ${{ matrix.musl == false && matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          SUFFIX=$(echo "${{ matrix.artifact }}" | sed 's/^cli-//')
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} \
             dist/toloo-cli-${SUFFIX}
          chmod +x dist/*

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          SUFFIX=$(echo "${{ matrix.artifact }}" | sed 's/^cli-//')
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} \
             dist/toloo-cli-${SUFFIX}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  # ────────────────────────────────────────────────────────────────────
  # Browser package — toloo-core compiled to wasm32 + JS/TS glue
  # ────────────────────────────────────────────────────────────────────
  build-wasm:
    name: Build (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - uses: cargo-bins/cargo-binstall@v1.17.5
        env:
          BINSTALL_VERSION: "1.17.5"
      - name: Install wasm-bindgen-cli
        run: cargo binstall --no-confirm wasm-bindgen-cli --version 0.2.126

      - name: Build browser package
        run: ./toloo-wasm/build.sh

      - name: Smoke-test generated package
        run: node toloo-wasm/test-package.mjs

      - name: Package
        run: |
          mkdir -p dist
          cp -r toloo-wasm/pkg dist/toloo-wasm
          cd dist && zip -r toloo-wasm.zip toloo-wasm

      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: dist/

  # ────────────────────────────────────────────────────────────────────
  # Create GitHub Release — runs after all jobs complete
  # ────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build-native, build-android, build-cli, build-wasm]
    if: ${{ !cancelled() && needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          name: "Toloo ${{ github.ref_name }}"
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Toloo ${{ github.ref_name }}

            | Platform | File | Notes |
            |---|---|---|
            | Linux x86_64 | `toloo-native` | Slint native client — no WebView |
            | Linux aarch64 | `toloo-native` | Slint native client — no WebView |
            | Windows x86_64 | `toloo-native.exe` | Slint native client — no WebView |
            | macOS arm64 | `toloo-native` | Slint native client — no WebView |
            | Linux CLI (x86_64) | `toloo-cli-linux-x86_64` | Static musl binary, zero system deps |
            | Linux CLI (aarch64) | `toloo-cli-linux-aarch64` | Static musl binary, cross-compiled |
            | Browser | `toloo-wasm.zip` | ESM JS + TypeScript types + wasm32 package (`toloo-wasm/`) |
            | Android | `toloo-native.apk` | API 26+, arm64 + armv7; experimental, signed with the `toloo` release key |
          files: artifacts/**/*
