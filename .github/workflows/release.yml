name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:

  # ────────────────────────────────────────────────────────────────────
  # Toloo app binaries — Slint UI, no WebView, direct Rust core.
  # ────────────────────────────────────────────────────────────────────
  build-app:
    name: App (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
            binary: target/release/toloo-app
          - os: ubuntu-24.04-arm
            artifact: linux-aarch64
            binary: target/release/toloo-app
          - os: windows-latest
            artifact: windows-x86_64
            binary: target/release/toloo-app.exe
          - os: macos-latest
            artifact: macos-aarch64
            binary: target/release/toloo-app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.artifact }}
      - name: Install Slint build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libfontconfig1-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libgl1-mesa-dev
      - name: Build
        run: cargo build -p toloo-app --release
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          ext=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then ext=".exe"; fi
          mkdir -p dist
          cp "${{ matrix.binary }}" \
            "dist/toloo-app-${version}-${{ matrix.artifact }}${ext}"
          chmod +x dist/* 2>/dev/null || true
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.artifact }}
          path: dist/

  build-android:
    name: Android APK (experimental)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: cargo-bins/cargo-binstall@v1.17.5
        env:
          BINSTALL_VERSION: "1.17.5"
      - name: Install cargo-ndk
        run: cargo binstall --no-confirm cargo-ndk@4.1.2 || cargo install cargo-ndk --version 4.1.2 --locked
      - name: Decode release signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/android"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d \
            > "$RUNNER_TEMP/android/toloo-release.jks"
      - name: Build Android native libraries
        run: ./toloo-app/android/build-native.sh
      - name: Build signed APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android/toloo-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: toloo
        run: gradle -p toloo-app/android --no-daemon assembleRelease
      - name: Package APKs
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/android
          apkdir=toloo-app/android/app/build/outputs/apk/release
          cp "$apkdir/app-arm64-v8a-release.apk" \
            "dist/android/toloo-app-${version}-android-arm64-v8a.apk"
          cp "$apkdir/app-armeabi-v7a-release.apk" \
            "dist/android/toloo-app-${version}-android-armeabi-v7a.apk"
          cp "$apkdir/app-universal-release.apk" \
            "dist/android/toloo-app-${version}-android-universal.apk"
          ls -lh dist/android
      - uses: actions/upload-artifact@v4
        with:
          name: toloo-app-android
          path: dist/android/*.apk
          if-no-files-found: error

  build-cli:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — fully static musl binary, runs on any Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: cli-linux-x86_64
            binary: toloo
            musl: true

          # Linux aarch64 — fully static musl binary, cross-compiled
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: cli-linux-aarch64
            binary: toloo
            musl: true
            musl_cross: true

          # Windows x86_64 — static CRT, no MSVC redistributable needed
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: cli-windows-x86_64
            binary: toloo.exe
            musl: false

          # Windows aarch64 — Surface / Snapdragon, static CRT
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: cli-windows-aarch64
            binary: toloo.exe
            musl: false

          # macOS x86_64 — no Xcode needed for a pure Rust CLI
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: cli-macos-x86_64
            binary: toloo
            musl: false

          # macOS aarch64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: cli-macos-aarch64
            binary: toloo
            musl: false

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}

      - name: Install musl tools
        if: matrix.musl == true
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache pip packages (Zig cross toolchain)
        if: matrix.musl_cross == true
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ziglang-${{ runner.os }}-${{ runner.arch }}-zig0.15-zigbuild0.19

      - name: Install cargo-zigbuild (aarch64 musl cross)
        if: matrix.musl_cross == true
        run: pip3 install ziglang cargo-zigbuild

      - name: Build
        run: ${{ matrix.musl_cross == true && 'cargo zigbuild' || 'cargo build' }} -p toloo-cli --release --target ${{ matrix.target }}
        env:
          # Statically link the CRT on Windows — .exe runs on any Win10+ with no redistributables
          RUSTFLAGS: ${{ matrix.musl == false && matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          SUFFIX=$(echo "${{ matrix.artifact }}" | sed 's/^cli-//')
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} \
             "dist/toloo-cli-${version}-${SUFFIX}"
          chmod +x dist/*

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          SUFFIX=$(echo "${{ matrix.artifact }}" | sed 's/^cli-//')
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} \
             "dist/toloo-cli-${version}-${SUFFIX}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  # ────────────────────────────────────────────────────────────────────
  # Browser package — toloo-core compiled to wasm32 + JS/TS glue
  # ────────────────────────────────────────────────────────────────────
  build-wasm:
    name: Build (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - uses: cargo-bins/cargo-binstall@v1.17.5
        env:
          BINSTALL_VERSION: "1.17.5"
      - name: Install wasm-bindgen-cli
        run: cargo binstall --no-confirm wasm-bindgen-cli --version 0.2.126

      - name: Build browser package
        run: ./toloo-wasm/build.sh

      - name: Smoke-test generated package
        run: node toloo-wasm/test-package.mjs

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp -r toloo-wasm/pkg dist/toloo-wasm
          (cd dist && zip -r "toloo-wasm-${version}.zip" toloo-wasm)
          rm -rf dist/toloo-wasm

      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: dist/

  # ────────────────────────────────────────────────────────────────────
  # Create GitHub Release — runs after all jobs complete
  # ────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build-app, build-android, build-cli, build-wasm]
    if: ${{ !cancelled() && needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Build release notes
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="https://github.com/${REPO}/releases/download/${TAG}"
          previous="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"

          row() {
            local platform="$1"
            shift
            local cell=""
            while [ "$#" -gt 0 ]; do
              local label="$1"
              local file="$2"
              shift 2
              if find artifacts -type f -name "$file" -print -quit | grep -q .; then
                if [ -n "$cell" ]; then cell+=" · "; fi
                cell+="[${label}](${base}/${file})"
              fi
            done
            if [ -n "$cell" ]; then
              printf '| %s | %s |\n' "$platform" "$cell"
            fi
          }

          {
            echo "## Binaries"
            echo
            echo "| Platform | Download |"
            echo "|---|---|"
            row "Linux x86_64" "App" "toloo-app-${version}-linux-x86_64" "CLI" "toloo-cli-${version}-linux-x86_64"
            row "Linux arm64" "App" "toloo-app-${version}-linux-aarch64" "CLI" "toloo-cli-${version}-linux-aarch64"
            row "Windows x86_64" "App" "toloo-app-${version}-windows-x86_64.exe" "CLI" "toloo-cli-${version}-windows-x86_64.exe"
            row "Windows arm64" "CLI" "toloo-cli-${version}-windows-aarch64.exe"
            row "macOS arm64" "App" "toloo-app-${version}-macos-aarch64" "CLI" "toloo-cli-${version}-macos-aarch64"
            row "macOS x86_64" "CLI" "toloo-cli-${version}-macos-x86_64"
            row "Android arm64" "APK" "toloo-app-${version}-android-arm64-v8a.apk"
            row "Android armv7" "APK" "toloo-app-${version}-android-armeabi-v7a.apk"
            row "Android universal" "APK" "toloo-app-${version}-android-universal.apk"
            row "Browser" "Package" "toloo-wasm-${version}.zip"
            echo
            echo "## Changelog"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --pretty=format:"- [%h](https://github.com/${REPO}/commit/%H) %s" "${previous}..${TAG}"
            else
              echo "_Initial release._"
            fi
            echo
          } > release-notes.md

          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: "Toloo ${{ github.ref_name }}"
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: artifacts/**/*
