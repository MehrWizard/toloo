[package]
name = "toloo-protocol-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Benchmark-only cross-protocol harness (Signal, Matrix, Nostr). Not part of the relay."
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
serde_json = "1"
toloo-lib = { path = "../toloo-lib" }

# Heavy protocol libraries are optional so normal workspace builds/tests never
# compile them.
ed25519-dalek = { version = "3", features = ["pkcs8"], optional = true }
libsignal-protocol-syft = { version = "=0.85.3-beta.5", optional = true }
nostr = { version = "0.45", features = ["nip44", "os-rng"], optional = true }
rand = { version = "0.9", optional = true }
ruma-common = { version = "0.20", default-features = false, optional = true }
ruma-signatures = { version = "0.22", optional = true }
tokio = { version = "1", features = ["rt", "macros"], optional = true }
vodozemac = { version = "0.11", optional = true }

[features]
default = []
protocols = [
    "dep:ed25519-dalek",
    "dep:libsignal-protocol-syft",
    "dep:nostr",
    "dep:rand",
    "dep:ruma-common",
    "dep:ruma-signatures",
    "dep:tokio",
    "dep:vodozemac",
]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "protocols"
harness = false
required-features = ["protocols"]
